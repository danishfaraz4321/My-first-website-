<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature BEAUTY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">🌲 Nature BEAUTY</div>
        <div class="menu">
            <a href="#">Home</a>
            <a href="#">Mountains</a>
            <a href="https://www.pexels.com" class="active">Pexels Website</a>
        </div>
    </nav>

    <h1 class="title">Nature BEAUTY</h1>

    <div class="gallery">
        <div class="card">
            <img src="https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg?auto=compress&w=500" alt="Mountain">
            <button>🏔️ Mountain View</button>
        </div>
        <div class="card">
            <img src="https://images.pexels.com/photos/167699/pexels-photo-167699.jpeg?auto=compress&w=500" alt="Forest">
            <button>🌲 Foggy Forest</button>
        </div>
        <div class="card">
            <img src="https://images.pexels.com/photos/417173/pexels-photo-417173.jpeg?auto=compress&w=500" alt="Fort">
            <button>🏰 Snow Mountain</button>
        </div>
        <div class="card">
            <img src="https://images.pexels.com/photos/259280/pexels-photo-259280.jpeg?auto=compress&w=500" alt="Valley">
            <button>☘️ Green Valley</button>
        </div>
        <div class="card">
            <img src="https://images.pexels.com/photos/2132126/pexels-photo-2132126.jpeg?auto=compress&w=500" alt="Lake">
            <button>🏞️ Hiking Adventure</button>
        </div>
        <div class="card">
            <img src="https://images.pexels.com/photos/158163/clouds-cloudporn-weather-lookup-158163.jpeg?auto=compress&w=500" alt="Clouds">
            <button>☁️ Cloudy Sky</button>
        </div>
    </div>

    <div class="bottom-btns">
        <a href="https://www.pexels.com/search/nature/" class="btn-outline">See More on Pexels Website</a>
        <a href="https://www.youtube.com/results?search_query=nature+4k+video" class="btn-fill">Watch Nature 4K Video</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
